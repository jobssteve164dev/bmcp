name: Release VS Code Extension

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Leave empty to bump patch."
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 获取完整历史以正确计算 release notes 和 tags

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: version
        run: |
          # 判定升级策略
          BUMP_TYPE="patch"
          COMMIT_MSG=""
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.version }}" ]; then
              BUMP_TYPE="${{ github.event.inputs.version }}"
            fi
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -qiE '#major|\[major\]'; then
              BUMP_TYPE="major"
            elif echo "$COMMIT_MSG" | grep -qiE '#minor|\[minor\]'; then
              BUMP_TYPE="minor"
            fi
          fi
          
          echo "Bumping version using type: $BUMP_TYPE"
          npm version "$BUMP_TYPE" -m "chore: release v%s [skip ci]"
          
          NEW_VER=$(node -p "require('./package.json').version")
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        run: |
          # 强行推送本地修改和 tag，使用 GITHUB_TOKEN 的授权
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --allow-star-activation -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Summary
        run: echo "Published BMCP v${{ steps.version.outputs.version }} and created GitHub Release"
