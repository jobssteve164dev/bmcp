name: Release VS Code Extension

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish. Leave empty to republish the current package version."
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 获取完整历史以正确计算 release notes 和 tags

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve version and tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            TARGET_VERSION="${{ github.event.inputs.version }}"
            if [ -z "$TARGET_VERSION" ]; then
              TARGET_VERSION="$CURRENT_VERSION"
            fi

            if [ "$TARGET_VERSION" != "$CURRENT_VERSION" ]; then
              npm version "$TARGET_VERSION" -m "chore: release v%s [skip ci]"
            elif ! git rev-parse "v$TARGET_VERSION" >/dev/null 2>&1; then
              git tag -a "v$TARGET_VERSION" -m "v$TARGET_VERSION"
            fi
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            BUMP_TYPE="patch"
            if echo "$COMMIT_MSG" | grep -qiE '#major|\[major\]'; then
              BUMP_TYPE="major"
            elif echo "$COMMIT_MSG" | grep -qiE '#minor|\[minor\]'; then
              BUMP_TYPE="minor"
            fi
            npm version "$BUMP_TYPE" -m "chore: release v%s [skip ci]"
          fi

          NEW_VER=$(node -p "require('./package.json').version")
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        run: |
          # 强行推送本地修改和 tag，使用 GITHUB_TOKEN 的授权
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_URL="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/SZLK/vsextensions/solobrowser/$VERSION/vspackage"

          if curl --fail --silent --location --output /dev/null "$PACKAGE_URL"; then
            echo "Visual Studio Marketplace already has SoloBrowser v$VERSION."
            exit 0
          fi

          for attempt in 1 2 3; do
            if npx vsce publish --allow-star-activation -p "$VSCE_PAT"; then
              exit 0
            fi
            if curl --fail --silent --location --output /dev/null "$PACKAGE_URL"; then
              echo "Visual Studio Marketplace accepted SoloBrowser v$VERSION despite the timed-out publish request."
              exit 0
            fi
            echo "Marketplace publish attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
          exit 1
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Summary
        run: echo "Published SoloBrowser v${{ steps.version.outputs.version }} and created GitHub Release"
